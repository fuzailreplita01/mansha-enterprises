<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <!-- Phone body -->
  <rect x="20" y="10" width="80" height="180" rx="12" ry="12" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Screen -->
  <rect x="28" y="28" width="64" height="120" rx="4" ry="4" fill="#f8fafc"/>
  <!-- Home button area -->
  <circle cx="60" cy="175" r="6" fill="#cbd5e1"/>
  <!-- Camera -->
  <circle cx="60" cy="20" r="3" fill="#cbd5e1"/>
  <!-- Phone icon on screen -->
  <text x="60" y="96" font-family="system-ui" font-size="32" text-anchor="middle" fill="#94a3b8">📱</text>
</svg>
